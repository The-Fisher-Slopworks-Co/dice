# Everything a pull request runs. Publishing to GitHub Pages lives in
# deploy.yml, which pull requests don't trigger at all — see check.yml for why
# that split exists rather than an `if:` on that job.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
