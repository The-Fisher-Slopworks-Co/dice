<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dice gallery</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #071522;
        color: #92a6b5;
        font:
          500 12px "IBM Plex Mono",
          monospace;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #grid {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        pointer-events: none;
      }
      #grid span {
        align-self: end;
        justify-self: center;
        padding-bottom: 8px;
        letter-spacing: 0.15em;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
